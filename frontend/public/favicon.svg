<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6cf0"/>
      <stop offset="100%" stop-color="#583fe0"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd9e8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb592" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c6cf0" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ticket Body with Notches -->
  <path d="M 8 16 C 8 11.58 11.58 8 16 8 L 48 8 C 52.42 8 56 11.58 56 16 L 56 26 C 52 26 49 28.68 49 32 C 49 35.32 52 38 56 38 L 56 48 C 56 52.42 52.42 56 48 56 L 16 56 C 11.58 56 8 52.42 8 48 L 8 38 C 12 38 15 35.32 15 32 C 15 28.68 12 26 8 26 Z" 
        fill="url(#doorGrad)" filter="url(#glow)"/>

  <!-- Perforated Line -->
  <line x1="22" y1="12" x2="22" y2="52" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Spotlight Beam from Open Door -->
  <polygon points="32,16 48,22 48,42 32,48" fill="url(#beamGrad)"/>

  <!-- Cinema Portal Door Symbol -->
  <rect x="28" y="20" width="12" height="24" rx="2" fill="#ffffff" opacity="0.95"/>
  <circle cx="37" cy="32" r="1.5" fill="#7c6cf0"/>
  <polygon points="43,26 47,24 47,40 43,38" fill="#ffd9e8" opacity="0.8"/>
</svg>
