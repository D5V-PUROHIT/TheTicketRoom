<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <radialGradient id="deepSpace" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2a1b4e"/>
      <stop offset="35%" stop-color="#18112d"/>
      <stop offset="70%" stop-color="#0c0817"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <radialGradient id="nebulaGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff8fa3" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#7c6cf0" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#38c28f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="astrolabeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="beamLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7c6cf0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="60%" stop-color="#07040e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#07040e"/>
    </linearGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="900" fill="url(#deepSpace)"/>
  <rect width="600" height="900" fill="url(#nebulaGlow)"/>

  <!-- Starfield Clusters -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="80" cy="120" r="1.5"/>
    <circle cx="140" cy="80" r="1"/>
    <circle cx="210" cy="160" r="2" filter="url(#bloom)"/>
    <circle cx="280" cy="90" r="1.2"/>
    <circle cx="370" cy="140" r="1.8"/>
    <circle cx="450" cy="100" r="1.4"/>
    <circle cx="510" cy="180" r="2" filter="url(#bloom)"/>
    <circle cx="120" cy="240" r="1"/>
    <circle cx="480" cy="270" r="1.6"/>
    <circle cx="310" cy="220" r="1.2"/>
    <circle cx="90" cy="360" r="1.4"/>
    <circle cx="530" cy="380" r="1.8"/>
    <circle cx="220" cy="340" r="1"/>
    <circle cx="390" cy="330" r="1.5"/>
  </g>

  <!-- Distant Celestial Astrolabe Rings -->
  <g transform="translate(300, 360)" filter="url(#bloom)">
    <circle cx="0" cy="0" r="170" fill="none" stroke="url(#astrolabeGold)" stroke-width="2" stroke-dasharray="4,8" opacity="0.65"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#7c6cf0" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#ff8fa3" stroke-width="2" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="190" ry="60" fill="none" stroke="url(#astrolabeGold)" stroke-width="2.5" transform="rotate(-28)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="160" ry="40" fill="none" stroke="#38c28f" stroke-width="1.5" transform="rotate(40)" opacity="0.6"/>

    <!-- Luminous Solstice Core -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" filter="url(#bloom)"/>
    <circle cx="0" cy="0" r="50" fill="#fde047" opacity="0.35" filter="url(#bloom)"/>
  </g>

  <!-- Laser Beam from Observatory Telescope -->
  <polygon points="297,630 303,630 310,360 290,360" fill="url(#beamLight)" filter="url(#bloom)"/>

  <!-- Mountain Silhouette & Observatory Dome -->
  <path d="M 0 740 Q 180 670 300 640 Q 420 670 600 740 L 600 900 L 0 900 Z" fill="#080410"/>
  
  <!-- Modern Observatory Dome -->
  <g transform="translate(300, 640)">
    <rect x="-35" y="-10" width="70" height="20" rx="4" fill="#1c142c" stroke="#372754" stroke-width="1.5"/>
    <path d="M -26 -10 A 26 26 0 0 1 26 -10 Z" fill="#2d1e47" stroke="#7c6cf0" stroke-width="2"/>
    <rect x="-4" y="-34" width="8" height="26" fill="#0f091a"/>
    <!-- Dome Slit Aperture -->
    <line x1="0" y1="-32" x2="0" y2="-10" stroke="#ffd9e8" stroke-width="3" filter="url(#bloom)"/>
  </g>

  <!-- Bottom Fog / Vignette -->
  <rect y="500" width="600" height="400" fill="url(#bottomFade)"/>

  <!-- Studio Header -->
  <text x="300" y="55" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#a59fca" letter-spacing="4" text-anchor="middle">
    A THETICKETROOM ORIGINAL PRESENTATION
  </text>
  <line x1="160" y1="70" x2="440" y2="70" stroke="#7c6cf0" stroke-width="1" opacity="0.4"/>

  <!-- Badges Row -->
  <g transform="translate(300, 700)" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700">
    <rect x="-140" y="-12" width="80" height="22" rx="4" fill="rgba(124, 108, 240, 0.2)" stroke="#7c6cf0" stroke-width="1"/>
    <text x="-100" y="3" fill="#ffffff">IMAX 3D</text>

    <rect x="-45" y="-12" width="90" height="22" rx="4" fill="rgba(255, 143, 163, 0.2)" stroke="#ff8fa3" stroke-width="1"/>
    <text x="0" y="3" fill="#ffffff">DOLBY ATMOS</text>

    <rect x="60" y="-12" width="80" height="22" rx="4" fill="rgba(56, 194, 143, 0.2)" stroke="#38c28f" stroke-width="1"/>
    <text x="100" y="3" fill="#ffffff">4K LASER</text>
  </g>

  <!-- Title Block -->
  <text x="300" y="760" font-family="'Bricolage Grotesque', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle" filter="url(#bloom)">
    MIDNIGHT AT THE
  </text>
  <text x="300" y="805" font-family="'Bricolage Grotesque', sans-serif" font-size="46" font-weight="800" fill="#ffd9e8" letter-spacing="3" text-anchor="middle">
    OBSERVATORY
  </text>

  <!-- Subtitle & Credits -->
  <text x="300" y="840" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#c2bde2" letter-spacing="2" text-anchor="middle">
    SOME FREQUENCIES ARE NOT MEANT TO BE DECODED
  </text>
  <text x="300" y="870" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="500" fill="#7d769c" letter-spacing="1.5" text-anchor="middle">
    STARRING ELENA VANCE • DR. JULIAN THORNE • DIRECTED BY A. VANCE
  </text>
</svg>
