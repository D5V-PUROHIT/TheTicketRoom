<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b070c"/>
      <stop offset="50%" stop-color="#6b1d14"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#b45309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="goldR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="65%" stop-color="#1a0508" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#140406"/>
    </linearGradient>
  </defs>

  <!-- Crimson & Saffron Twilight Background -->
  <rect width="400" height="600" fill="url(#bgR)"/>
  <rect width="400" height="600" fill="url(#sunGlow)"/>

  <!-- Sacred Dharma Mandala Halo -->
  <g transform="translate(200, 225)">
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#goldR)" stroke-width="1.5" stroke-dasharray="4,7" opacity="0.7"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#fde047" stroke-width="2" opacity="0.55"/>
    <circle cx="0" cy="0" r="62" fill="#f59e0b" opacity="0.22"/>
    <circle cx="0" cy="0" r="42" fill="#fef08a" opacity="0.35"/>

    <!-- Golden Bow & Arrow Emblem -->
    <path d="M -32 -78 C 48 -42 48 42 -32 78" fill="none" stroke="url(#goldR)" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="-32" y1="-78" x2="-32" y2="78" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>
    <line x1="-58" y1="0" x2="64" y2="0" stroke="url(#goldR)" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="72,0 54,-8 58,0 54,8" fill="#fef08a"/>
    <polygon points="-58,0 -68,-7 -63,0 -68,7" fill="#fbbf24"/>
  </g>

  <!-- Ancient Palace / Temple Silhouette -->
  <path d="M 0 390 L 35 390 L 45 362 L 55 390 L 120 390 L 132 348 L 144 390 L 180 390 L 200 326 L 220 390 L 256 390 L 268 348 L 280 390 L 345 390 L 355 362 L 365 390 L 400 390 L 400 600 L 0 600 Z" fill="#180408" opacity="0.85"/>
  <rect y="330" width="400" height="270" fill="url(#fadeR)"/>

  <!-- Typography matching other Upcoming SVG Posters -->
  <text x="200" y="55" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#fde68a" letter-spacing="3" text-anchor="middle" opacity="0.85">
    AN IMMORTAL LEGEND RETURNS
  </text>

  <text x="200" y="470" font-family="'Bricolage Grotesque', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">
    RAMAYANA
  </text>
  <text x="200" y="502" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#fcd34d" text-anchor="middle" letter-spacing="2.5">
    HINDI • THE ETERNAL EPIC
  </text>
  <text x="200" y="542" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#fdba74" text-anchor="middle" letter-spacing="1">
    UPCOMING RELEASE • DOLBY ATMOS 7.1
  </text>
</svg>
